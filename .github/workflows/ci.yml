name: BackEnd CI

on:
    push:
      branches: [ main ]
    pull_request:
      branches: [ main ]

jobs:
    ci:
      runs-on: ubuntu-latest

      env:
        PORT: 5000
        MONGO_URI: ${{ secrets.MONGO_URI }}
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}

      steps:
        - name: Checkout code
          uses: actions/checkout@v2

        - name: Setup Node.js
          uses: actions/setup-node@v2
          with:
            node-version: '22'
            cache: npm

        - name: Install dependencies
          run: npm install

        - name: Start server
          run: node BackEnd/app.js &

        - name: Smoke test API
          run: |
            sleep 3
            curl -fsS http://localhost:5000/schedules
            curl -fsS -o /dev/null -w "%{http_code}" http://localhost:5000/admin | grep -q 200